name: Security

on:
  pull_request:
  push:
    branches: [main]

# Blocks a PR whenever a security invariant regresses: RLS/GRANT gaps,
# role-escalation paths, mutable audit trail, or a vulnerable dependency.
jobs:
  security:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Database policy guard (RLS, GRANTs, role escalation, audit immutability)
        run: bun run security:sql

      - name: Security test suite (RLS, role flows, privilege escalation)
        run: bun run test:security

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Dependency audit (fails on high/critical advisories)
        run: bun audit --audit-level=high

